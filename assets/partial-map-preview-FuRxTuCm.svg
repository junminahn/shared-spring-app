<svg xmlns="http://www.w3.org/2000/svg" width="192" height="144" viewBox="0 0 192 144" shape-rendering="geometricPrecision">
  <!-- Route thumbnail: town half → field half, quest trail between.
       Same 192x144 viewBox, same halves and caption as the original;
       rebuilt with gradients/canopies/glow so it reads as a minimap
       instead of flat blocks. Shown at 96x72 on the title screen. -->
  <defs>
    <linearGradient id="pmFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#141d2e"/>
    </linearGradient>
    <linearGradient id="pmPlaza" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5aa8b"/>
      <stop offset="1" stop-color="#8f8468"/>
    </linearGradient>
    <linearGradient id="pmGrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b7f5c"/>
      <stop offset="1" stop-color="#33573f"/>
    </linearGradient>
    <linearGradient id="pmWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#85a6a1"/>
      <stop offset="1" stop-color="#3b6d84"/>
    </linearGradient>
    <radialGradient id="pmWin" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#fff7cc"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <radialGradient id="pmFire" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fdba74" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fdba74" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="192" height="144" fill="#0f172a"/>
  <rect x="8" y="8" width="176" height="112" fill="url(#pmFrame)"/>
  <!-- town half -->
  <rect x="12" y="12" width="82" height="82" fill="url(#pmPlaza)"/>
  <g fill="#000000" opacity="0.12">
    <circle cx="30" cy="34" r="2"/><circle cx="48" cy="28" r="2"/><circle cx="66" cy="36" r="2"/>
    <circle cx="38" cy="56" r="2"/><circle cx="58" cy="60" r="2"/><circle cx="76" cy="54" r="2"/>
    <circle cx="28" cy="72" r="2"/><circle cx="50" cy="74" r="2"/>
  </g>
  <g>
    <ellipse cx="29" cy="39" rx="13" ry="3" fill="#000000" opacity="0.25"/>
    <rect x="18" y="22" width="22" height="15" fill="#4a3a2a"/>
    <path d="M16,22 L29,15 L42,22 Z" fill="#7a4a3a"/>
    <path d="M18,21 L29,15.5 L40,21" stroke="#c07a5a" stroke-width="1.2" fill="none" opacity="0.8"/>
    <rect x="24" y="27" width="8" height="8" rx="1" fill="#241a10"/>
    <rect x="25" y="28" width="6" height="6" rx="1" fill="url(#pmWin)"/>
    <ellipse cx="70" cy="43" rx="14" ry="3" fill="#000000" opacity="0.25"/>
    <rect x="58" y="26" width="24" height="15" fill="#3d2f20"/>
    <path d="M56,26 L70,19 L84,26 Z" fill="#8a5a4a"/>
    <rect x="64" y="31" width="8" height="8" rx="1" fill="#241a10"/>
    <rect x="65" y="32" width="6" height="6" rx="1" fill="url(#pmWin)" opacity="0.85"/>
  </g>
  <!-- fountain -->
  <g>
    <ellipse cx="47" cy="72" rx="11" ry="4" fill="#000000" opacity="0.25"/>
    <ellipse cx="47" cy="69" rx="9" ry="6" fill="#899283"/>
    <ellipse cx="47" cy="68" rx="6" ry="4" fill="#245985"/>
    <rect x="45" y="58" width="4" height="10" fill="#899283"/>
    <ellipse cx="47" cy="58" rx="5" ry="2.5" fill="#9fb3bd"/>
    <circle cx="47" cy="55" r="1.6" fill="#e7eef5"/>
    <circle cx="43" cy="66" r="1" fill="#e7eef5" opacity="0.9"/>
    <circle cx="51" cy="67" r="1" fill="#e7eef5" opacity="0.8"/>
  </g>
  <rect x="12" y="78" width="82" height="8" fill="#9a825e"/>
  <rect x="12" y="78" width="82" height="2" fill="#b59a72"/>
  <rect x="12" y="98" width="82" height="10" fill="#7a5a4a"/>
  <rect x="12" y="98" width="82" height="2" fill="#8a6a55"/>
  <g fill="#000000" opacity="0.15">
    <circle cx="28" cy="103" r="1.6"/><circle cx="52" cy="102" r="1.6"/><circle cx="74" cy="104" r="1.6"/>
  </g>
  <!-- field half -->
  <rect x="98" y="12" width="82" height="82" fill="url(#pmGrass)"/>
  <ellipse cx="130" cy="40" rx="26" ry="12" fill="#16291f" opacity="0.35"/>
  <ellipse cx="155" cy="70" rx="24" ry="12" fill="#5a8a63" opacity="0.3"/>
  <!-- winding trail from the town gate -->
  <path d="M94,82 C110,74 118,66 132,62 C146,58 154,52 166,50" stroke="#827258" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M94,82 C110,74 118,66 132,62 C146,58 154,52 166,50" stroke="#a08a64" stroke-width="2" fill="none" stroke-dasharray="3 3" opacity="0.8"/>
  <!-- quest route waypoints -->
  <g fill="#fde68a" stroke="#0f172a" stroke-width="1.5">
    <circle cx="112" cy="70" r="4"/><circle cx="136" cy="60" r="4"/><circle cx="162" cy="51" r="4.5"/>
  </g>
  <g fill="#fff7cc">
    <circle cx="112" cy="70" r="1.3"/><circle cx="136" cy="60" r="1.3"/><circle cx="162" cy="51" r="1.5"/>
  </g>
  <!-- water rill -->
  <rect x="160" y="12" width="9" height="82" fill="url(#pmWater)"/>
  <path d="M162,16 v74 M166,14 v78" stroke="#e7eef5" stroke-width="1" opacity="0.5"/>
  <!-- trees: shadow + trunk + layered canopy + lit crown -->
  <g>
    <ellipse cx="112" cy="34" rx="9" ry="2.5" fill="#000000" opacity="0.3"/>
    <rect x="110" y="26" width="3" height="8" fill="#3a2a18"/>
    <circle cx="111" cy="22" r="7" fill="#264f3e"/><circle cx="106" cy="24" r="5" fill="#264f3e"/>
    <circle cx="109" cy="19" r="4" fill="#4b7f5c"/>
    <ellipse cx="140" cy="72" rx="9" ry="2.5" fill="#000000" opacity="0.3"/>
    <rect x="138" y="64" width="3" height="8" fill="#3a2a18"/>
    <circle cx="139" cy="60" r="7" fill="#264f3e"/><circle cx="144" cy="62" r="5" fill="#264f3e"/>
    <circle cx="137" cy="57" r="4" fill="#4b7f5c"/>
  </g>
  <!-- camp: tent + fire glow + bedroll -->
  <g>
    <ellipse cx="121" cy="80" rx="11" ry="3" fill="#000000" opacity="0.3"/>
    <circle cx="119" cy="74" r="9" fill="url(#pmFire)"/>
    <path d="M104,78 L112,66 L120,78 Z" fill="#70513a"/>
    <path d="M112,66 L120,78 L114,78 Z" fill="#000000" opacity="0.25"/>
    <path d="M104,78 h16" stroke="#d57a5b" stroke-width="2"/>
    <circle cx="119" cy="74" r="2.5" fill="#fdba74"/>
    <circle cx="119" cy="74" r="1.2" fill="#fff7cc"/>
  </g>
  <!-- river -->
  <rect x="98" y="98" width="82" height="10" fill="url(#pmWater)"/>
  <path d="M100,101 h76" stroke="#e7eef5" stroke-width="1" opacity="0.5"/>
  <path d="M100,105 h76" stroke="#0f172a" stroke-width="1" opacity="0.4"/>
  <text x="96" y="124" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="9" fill="#94a3b8">TOWN → FIELD</text>
</svg>
