  <body>
    <div id="app"></div>
    <!-- HTML overlay panel — kept for accessibility/requirements 7.9, keyboard navigable (Tab/Arrows/Enter/ESC).
         Canonical in-game menu is Phaser OverworldScene menuContainer (see MenuOverlay.ts note).
         This #overlay is hidden by default and not rendered by Phaser; preserved to satisfy
         "Keep HTML #overlay panel" requirement and to provide fallback keyboard-navigable DOM. -->
    <div
      id="overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="overlay-title"
      hidden
      tabindex="-1"
      style="display: none"
    >
      <div id="overlay-panel">
        <h2 id="overlay-title">Menu — Shared Spring</h2>
        <div id="overlay-inventory" tabindex="0" aria-label="Inventory"></div>
        <div id="overlay-quests" tabindex="0" aria-label="Quests"></div>
        <button id="overlay-save" type="button">Save (P)</button>
        <button id="overlay-close" type="button" aria-label="Close menu (ESC)">Close (ESC)</button>
        <p id="overlay-status" role="status" aria-live="polite"></p>
      </div>
    </div>
  </body>
